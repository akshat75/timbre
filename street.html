<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timbre — The Street</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/street.css" />
</head>
<body>

  <div class="street-page" id="streetPage">
    <a href="world.html" class="back-arrow">← Eras</a>

    <div class="memories-icon" onclick="window.location.href='memories.html'">
      <div class="memories-icon__vinyl"><div class="memories-icon__hole"></div></div>
      <span class="memories-icon__badge" id="memoriesBadge" style="display:none">0</span>
    </div>

    <div class="street-header">
      <p class="street-header__era" id="eraLabel">Loading era...</p>
      <h2 class="street-header__title" id="eraTitle">The Street</h2>
    </div>

    <p class="street-placeholder">Venue selection coming on Day 2 →</p>
  </div>

  <script>
    const era = sessionStorage.getItem('currentEra');
    const eraLabel = document.getElementById('eraLabel');
    const eraTitle = document.getElementById('eraTitle');
    const page = document.getElementById('streetPage');

    eraLabel.textContent = era;

    const eraTitles = {
      '1970s': 'The Seventies',
      '1990s': 'The Nineties',
      '2020s': 'Now'
    };

    eraTitle.textContent = eraTitles[era] || era;

    // Apply era body class for future theming
    document.body.classList.add('era--' + era.replace('s',''));
  </script>
</body>
</html>
