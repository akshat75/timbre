<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timbre — The Street</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/street.css" />
</head>
<body>

  <!-- ══ FULL-SCREEN STREET SCENE ══ -->
  <div class="street-scene" id="streetScene">

    <!-- L1: Sky -->
    <div class="ss-sky"></div>

    <!-- L2: Distant background skyline -->
    <div class="ss-buildings-bg">
      <div class="ss-bldg ss-bldg--bg1"></div>
      <div class="ss-bldg ss-bldg--bg2"></div>
      <div class="ss-bldg ss-bldg--bg3"></div>
      <div class="ss-bldg ss-bldg--bg4"></div>
    </div>

    <!-- L3: Main flanking buildings -->
    <div class="ss-buildings-main">
      <div class="ss-bldg ss-bldg--ml1"></div>
      <div class="ss-bldg ss-bldg--ml2"></div>
      <div class="ss-bldg ss-bldg--mr1"></div>
      <div class="ss-bldg ss-bldg--mr2"></div>
    </div>

    <!-- L4: Left lamppost — flanks venue grid -->
    <div class="ss-lamp ss-lamp--left" id="lampLeft">
      <div class="ss-lamp__pole"></div>
      <div class="ss-lamp__arm"></div>
      <div class="ss-lamp__fixture"></div>
      <div class="ss-lamp__bulb"></div>
      <div class="ss-lamp__halo"></div>
    </div>

    <!-- L5: Right lamppost — flanks venue grid -->
    <div class="ss-lamp ss-lamp--right" id="lampRight">
      <div class="ss-lamp__pole"></div>
      <div class="ss-lamp__arm"></div>
      <div class="ss-lamp__fixture"></div>
      <div class="ss-lamp__bulb"></div>
      <div class="ss-lamp__halo"></div>
    </div>

    <!-- L6: Pavement -->
    <div class="ss-pavement">
      <div class="ss-pavement__surface"></div>
      <div class="ss-pavement__pool ss-pavement__pool--left"></div>
      <div class="ss-pavement__pool ss-pavement__pool--right"></div>
    </div>

    <!-- L7: Atmosphere / fog -->
    <div class="ss-fog"></div>

    <!-- L8: Animated FX — rain / birds / car / drone (JS populates this) -->
    <div class="ss-fx" id="streetFx"></div>

    <!-- L9: Edge vignette -->
    <div class="ss-vignette"></div>

  </div>

  <!-- ══ UI layer — transparent, sits on top of scene ══ -->
  <div class="street-page" id="streetPage">

    <a href="world.html" class="back-arrow">← Eras</a>

    <a href="index.html" class="page-logo-link" aria-label="Timbre home">
      <img src="info\Timbre-logo.svg" alt="Logo" class="page-logo">
    </a>

    <div class="memories-icon" onclick="window.location.href='memories.html'">
      <div class="memories-icon__vinyl"><div class="memories-icon__hole"></div></div>
      <span class="memories-icon__badge" id="memoriesBadge" style="display:none">0</span>
    </div>

    <div class="street-header">
      <p class="street-header__era" id="eraLabel"></p>
      <h2 class="street-header__title" id="eraTitle">The Street</h2>
    </div>

    <div class="venue-grid" id="venueGrid"></div>

  </div>

  <script src="js/world.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/memories.js"></script>
  <script>
    const era = sessionStorage.getItem('currentEra');
    document.getElementById('eraLabel').textContent = era;
    const titles = { '1970s': 'The Seventies', '1990s': 'The Nineties', '2020s': 'Now' };
    document.getElementById('eraTitle').textContent = titles[era] || era;
    document.body.classList.add('era--' + era.replace('s', ''));

    const memories = JSON.parse(localStorage.getItem('timbre_memories') || '[]');
    const badge = document.getElementById('memoriesBadge');
    if (memories.length > 0) { badge.textContent = memories.length; badge.style.display = 'flex'; }
  </script>
  <script src="js/street.js"></script>
</body>
</html>
