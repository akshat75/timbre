<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timbre — Memories</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/memories.css" />
</head>
<body class="memories-body">

  <!-- ── Back — goes to wherever the user came from ── -->
  <button class="back-arrow" onclick="history.back()">← Back</button>

    <a href="index.html" class="page-logo-link" aria-label="Timbre home">
      <img src="info\Timbre-logo.svg" alt="Logo" class="page-logo">
    </a>

  <!-- ── Page header ── -->
  <header class="mem-header">
    <h1 class="mem-title">Memories</h1>
    <p class="mem-subtitle">Everywhere you've been. Everything you've found.</p>
  </header>

  <!-- ── Filter strip ── -->
  <div class="mem-filters" id="memFilters">
    <button class="mem-filter mem-filter--active" data-filter="all">All</button>
    <button class="mem-filter" data-filter="1970s">The 70s</button>
    <button class="mem-filter" data-filter="1990s">The 90s</button>
    <button class="mem-filter" data-filter="2020s">Now</button>
  </div>

  <!-- ── Grid ── -->
  <div class="mem-grid" id="memoriesRoot"></div>

  <!-- ── Preview audio (hidden) ── -->
  <audio id="previewAudio" preload="none"></audio>

  <script src="js/world.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/memories.js"></script>
  <script src="js/memoriesPage.js"></script>
</body>
</html>
