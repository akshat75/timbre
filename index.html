<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timbre</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/landing.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>

  <!-- ====== LANDING CSS SCENE ====== -->
  <div class="scene--landing">
    <div class="scene__sky"></div>
    <div class="scene__midground">
      <div class="building building--left"></div>
      <div class="building building--right"></div>
      <div class="lamppost1">
        <div class="lamppost__pole"></div>
        <div class="lamppost__head"></div>
        <div class="lamppost__glow"></div>
      </div>
      <div class="lamppost2">
        <div class="lamppost__pole"></div>
        <div class="lamppost__head"></div>
        <div class="lamppost__glow"></div>
      </div>
    </div>
    <div class="scene__foreground">
      <div class="pavement"></div>
    </div>
    <div class="scene__fog"></div>
    <div class="scene__fx" id="rainContainer"></div>
  </div>

  <!-- ====== UI OVERLAY ====== -->
  <div class="landing__ui">

    <!-- What is Timbre? — top left -->
    <a href="about.html" class="whats-timbre">What is Timbre?</a>

    <!-- Memories icon top right -->
    <div class="memories-icon" id="memoriesIcon" onclick="window.location.href='memories.html'">
      <div class="memories-icon__vinyl">
        <div class="memories-icon__hole"></div>
      </div>
      <span class="memories-icon__badge" id="memoriesBadge" style="display:none">0</span>
    </div>

    <!-- Center content -->
    <div class="landing__center">

      <div class="logo-glow-wrap">
        <img src="info\Timbre-logo.svg" alt="Logo" class="landing-logo">
      </div>

      <p class="tagline">Music has always lived somewhere.</p>
      <button class="btn--enter" id="enterBtn">Enter the World</button>
    </div>

    <!-- Returning user message -->
    <div class="returning-user" id="returningUser" style="display:none"></div>

  </div>

  <!-- Scripts: world and api must load before main -->
  <script src="js/world.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/memories.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
