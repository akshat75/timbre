<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timbre — Choose Your Era</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/world.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>

  <!-- Cinematic animated background -->
  <div class="world-bg">
    <div class="world-bg__orb world-bg__orb--1"></div>
    <div class="world-bg__orb world-bg__orb--2"></div>
    <div class="world-bg__orb world-bg__orb--3"></div>
    <div class="world-bg__orb world-bg__orb--4"></div>
    <div class="world-bg__grain"></div>
    <div class="world-bg__vignette"></div>
    <div class="world-bg__rain"></div>
  </div>

  <div class="world-page">
    <a href="index.html" class="page-logo-link" aria-label="Timbre home">
      <img src="info\Timbre-logo.svg" alt="Logo" class="page-logo">
    </a>

    <!-- Search bar — top left (moved from landing) -->
    <div class="world-search">
      <input
        type="text"
        id="searchInput"
        placeholder="Search for a song..."
        autocomplete="off"
      />
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>

    <!-- Memories icon -->
    <div class="memories-icon" onclick="window.location.href='memories.html'">
      <div class="memories-icon__vinyl">
        <div class="memories-icon__hole"></div>
      </div>
      <span class="memories-icon__badge" id="memoriesBadge" style="display:none">0</span>
    </div>

    <div class="world-header">
      <h2 class="world-header__text">Choose Your Era</h2>
      <p class="world-header__sub">Where do you want to go?</p>
    </div>

    <div class="era-portals">

      <!-- 1970s Portal -->
      <div class="era-portal era-portal--70s" id="portal70s" onclick="enterEra('1970s')">
        <div class="portal__door">
          <div class="portal__handle"></div>
          <div class="portal__window"></div>
        </div>
        <div class="portal__light"></div>
        <div class="portal__label">
          <span class="portal__decade">The Seventies</span>
          <span class="portal__hint">4 venues · Jazz, Disco, Rock, Soul</span>
        </div>
      </div>

      <!-- 1990s Portal -->
      <div class="era-portal era-portal--90s" id="portal90s" onclick="enterEra('1990s')">
        <div class="portal__door">
          <div class="portal__handle"></div>
          <div class="portal__graffiti"></div>
        </div>
        <div class="portal__light"></div>
        <div class="portal__label">
          <span class="portal__decade">The Nineties</span>
          <span class="portal__hint">4 venues · Grunge, Hip-Hop, Indie, R&B</span>
        </div>
      </div>

      <!-- 2020s Portal -->
      <div class="era-portal era-portal--now" id="portalNow" onclick="enterEra('2020s')">
        <div class="portal__door">
          <div class="portal__handle"></div>
          <div class="portal__scanline"></div>
        </div>
        <div class="portal__light"></div>
        <div class="portal__label">
          <span class="portal__decade">The 2020s</span>
          <span class="portal__hint">4 venues · Hyperpop, Lo-fi, Trap, Bedroom Pop</span>
        </div>
      </div>

    </div>
  </div>

  <script src="js/world.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/memories.js"></script>
  <script>
    function enterEra(era) {
      sessionStorage.setItem('currentEra', era);
      window.location.href = 'street.html';
    }

    // Memories badge
    const memories = JSON.parse(localStorage.getItem('timbre_memories') || '[]');
    const badge = document.getElementById('memoriesBadge');
    if (memories.length > 0) {
      badge.textContent = memories.length;
      badge.style.display = 'flex';
    }

    // ---- Search bar (moved from landing) ----
    let searchTimeout = null;
    let previewAudio = null;

    const searchInput    = document.getElementById('searchInput');
    const searchDropdown = document.getElementById('searchDropdown');

    searchInput.addEventListener('input', () => {
      const term = searchInput.value.trim();
      clearTimeout(searchTimeout);
      if (term.length < 2) { closeDropdown(); return; }
      searchTimeout = setTimeout(async () => {
        const results = await API.searchSongs(term, 8);
        renderDropdown(results);
      }, 100);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.world-search')) closeDropdown();
    });

    function renderDropdown(tracks) {
      if (!tracks || !tracks.length) {
        searchDropdown.innerHTML = `<div class="search-empty">No results found</div>`;
        searchDropdown.classList.add('search-dropdown--open');
        return;
      }
      searchDropdown.innerHTML = tracks.map((track, i) => `
        <div class="search-result" data-index="${i}" tabindex="0">
          <img class="search-result-art" src="${track.artworkUrl60 || ''}" alt=""
               onerror="this.style.display='none'" />
          <div class="search-result-info">
            <div class="search-result-name">${track.trackName || 'Unknown'}</div>
            <div class="search-result-artist">${track.artistName || ''} · ${track.releaseDate ? new Date(track.releaseDate).getFullYear() : ''}</div>
          </div>
          <div class="search-result-genre">${track.primaryGenreName || ''}</div>
        </div>
      `).join('');

      searchDropdown.querySelectorAll('.search-result').forEach((el, i) => {
        el.addEventListener('mouseenter', () => playPreview(tracks[i].previewUrl));
        el.addEventListener('mouseleave', stopPreview);
        el.addEventListener('click', () => selectSong(tracks[i]));
      });
      searchDropdown.classList.add('search-dropdown--open');
    }

    function closeDropdown() {
      searchDropdown.classList.remove('search-dropdown--open');
      stopPreview();
    }

    function playPreview(url) {
      if (!url) return;
      stopPreview();
      previewAudio = new Audio(url);
      previewAudio.volume = 0.4;
      previewAudio.play().catch(() => {});
    }

    function stopPreview() {
      if (previewAudio) { previewAudio.pause(); previewAudio = null; }
    }

    async function selectSong(track) {
      stopPreview();
      closeDropdown();
      const venue = mapSongToVenue(track);
      await Navigation.goToVenue(venue, null, track);
    }
  </script>
</body>
</html>
